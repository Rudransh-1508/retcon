[project]
name = "retcon"
version = "0.1.0"
description = "Provenance-tracked agent memory over FalkorDB that revises real GitHub work when advisories are withdrawn."
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.0.10",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "fastapi>=0.115",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retcon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
